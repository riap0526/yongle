; Yongle settings (emperor_engine.ini). Put this file next to ddraw.dll (the game folder). UTF-8.
; Yongle keeps its files (this file, the log, shots\) in its own folder: the game folder, or
; Documents\My Games\Yongle when the game folder cannot be written to without administrator rights (e.g. under
; Program Files); then this file is copied there once, at the first start, and the copy there is the one used.
; The settings panel (Insert) shows the folder and opens it.
; A missing file or setting means the default shown here.
; Most of these can also be changed in game in our panel (Insert, see [ui] below). The panel writes only the values
; that change and keeps everything else in this file (comments, blank lines, settings it does not know).

[display]
; emulated = our own DirectDraw: the desktop resolution is never changed, the game's 1024x768 (and the
;            640x480 videos) are scaled into a borderless fullscreen window with SDL3.
; system   = the real Windows DirectDraw (real display mode changes), behind the logging wrapper; for comparison.
backend = emulated

; What puts the picture on the screen (emulated backend only). Takes effect after a restart.
; auto       = Direct3D 11, or Direct3D 9 if Direct3D 11 cannot start (default)
; direct3d   = Direct3D 9
; direct3d11 = Direct3D 11
renderer = auto

; How the picture is enlarged when the game's pixels are not the screen's (a display scale other than 100%,
; 1024x768, scaled menus, a window). At 100% in full screen the three look the same. Switches at once (also in the
; settings panel and in Display options).
; sharp_bilinear = nearest pixels with a one-pixel blend at their edges: sharp, even, no blur (default)
; nearest        = plain nearest neighbour (uneven pixel sizes when the scale is not a whole number)
; linear         = smooth, softer
scaling = sharp_bilinear

; How often frames reach the screen (emulated backend only):
; original = as the game itself does it: at most ~20 per second, shown from the game thread (for comparison)
; display  = every screen refresh (vsync), from our own output thread; the game never waits for it
; cap60    = like display, but at most 60 per second
; The game's timing (simulation ticks, animations, scrolling) is the same in all three.
present = display

; The logical resolution the game draws (emulated backend only); the output scales it to the screen.
; scaled   = the screen's native resolution divided by the display scale below (default)
; 1024x768 = the game's own size
; WxH      = any size of at least 1024x768, e.g. 1920x1080, 1280x1024, 2560x1080 (black bars if the screen's
;            aspect differs); windowed, it becomes the window's size
; In game, Shift+F7 cycles 1024x768 / scaled auto / scaled 100..250% until the game ends (this file is not changed).
; Emperor.inf keeps the game's own 1024x768 mode, so the game without this DLL starts as before.
resolution = scaled

; Display scale for resolution = scaled, 100..250 (percent, steps of 5):
; 100  = the sharpest picture: every pixel of the game is a pixel of the screen (default; small on a 4K screen)
; more = bigger but softer (the picture is enlarged)
; auto = the smallest scale that brings the height to 1080 or less (never below 768)
; Always limited so that the result stays at least 1024x768.
scale = 100

; The game's window (R2e). F5 (or Display options > Windowed screen) switches while playing.
; fullscreen = covering the monitor, without a border (default)
; windowed   = a window you can move, size and maximize; the game is laid out again for its size when you let go
;              (its client area divided by the display scale, at least 1024x768)
window = fullscreen
; The window's client size and position, kept when you size or move it (auto / center the first time).
window_width = auto
window_height = auto
window_x = center
window_y = center
; on = windowed, the cursor cannot leave the window while it is the active one (released when you switch to another
;      program, minimize it or press F5). Its border cannot be reached then: switch this off to move or size it.
window_lock_cursor = off

; Loading screens (the pictures shown while a game loads, with the status line under them):
; native       = their own size, centered, in a fret border, black around (R2d.1)
; scaled       = as large as the screen allows, in a fret border, on parchment (the game's own dialog tiles)
; scaled_black = the whole 1024x768 frame scaled to fit, black bars at the sides (as the first versions)
; original     = the whole 1024x768 frame at its own size, centered, black around (as the game itself on a wide screen)
loading_screen = native

; Menus, briefings, high scores, victory and defeat (the game's own 1024x768 pictures):
; native_city  = their own size in a fret border, with a picture of your city blurred and darkened around them:
;                menu_background.png (or .bmp) in Yongle's folder or the game folder if you put one there,
;                otherwise the city you saw last (kept as menu_background_auto.png); parchment until there is one
; native       = their own size in a fret border, on parchment
; scaled       = as large as the screen allows, in a fret border, on parchment
; scaled_black = the whole 1024x768 frame scaled to fit, black bars at the sides
; original     = the whole 1024x768 frame at its own size, centered, black around (as the game itself on a wide screen)
; Clicks outside the picture do nothing. (Before 0.1.3 scaled was called framed and scaled_black black; those
; names still work and are changed in this file when the game starts.)
menu_screens = native_city

; The game's intro movie at start-up (takes effect the next time the game starts):
; play = as the game does it (default)
; skip = straight to the main menu
; Yongle does not change the game's own Emperor.ini; PlayIntroMovie=no there skips the movie either way.
intro_movie = play

; The map of China (R2c), when the screen is larger than the map:
; scaled   = larger than its own size (china_map_scale), in a fret border, over the background
;            (china_map_background); cities, names and routes scale with it; clicks are converted
; native   = the picture's own size, centered, on the same background (the default since R2d.1)
; original = as the game draws it (top left; the rest of the screen is not redrawn)
china_map = native
; For scaled: fit = as large as the map area (left of the sidebar, below the top bar) allows (default);
; 100..400 (steps of 5) = that percentage of the map's own size, at most as large as fits
china_map_scale = fit
; Around the map (scaled and native):
; map  = the same map, blurred and darkened (default)
; city = your city as it was when you opened the map, as it is (the map like a window over it); it stands still
;        while the map is shown
china_map_background = map

; The picture of your city behind the menus (menu_screens = native_city):
; background_blur       = 0..8, how much it is blurred, in screen pixels (default 2; 0 = not blurred)
; background_brightness = 30..100 (steps of 5), in percent of the city itself (default 65)
background_blur = 2
background_brightness = 65

[ui]
; The key that opens and closes our settings panel (also closed with Esc; the game pauses while it is open).
; Default Insert. Other examples: F12, Ctrl+F12, Shift+Alt+P, Home, ScrollLock, Backquote, Numpad0.
; Modifiers: Ctrl, Shift, Alt (e.g. Ctrl+Shift+F10); the hotkey only acts with exactly those modifiers.
; Keys: F1..F24, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock, Tab, Space, Backquote,
;       A..Z, 0..9, Numpad0..Numpad9, NumpadAdd, NumpadSubtract, NumpadMultiply, NumpadDivide, NumpadDecimal.
; The key is kept from the game (also the character it types). Emperor uses Insert only to switch insert/overwrite
; in its text boxes, which is then unavailable. Keys the game does not use at all: F10, F11, F12, ScrollLock, Pause,
; Backquote. Most letters, digits, Space, Enter, PageUp/PageDown, Home, End, Delete, Tab, the arrows, F1..F9 and
; Alt+1..5 (screenshots) are game keys.
panel_key = Insert

; Size of the panel: auto = the screen height divided by 1080 (1080p: 100%, 1440p: 133%, 2160p: 200%), or
; 100..300 (percent, steps of 10). The panel is never taller than 80% of the screen; more content scrolls in it.
panel_scale = auto

; Where the building information window opens (right-click on a building); can be switched in the panel while
; playing and applies to the next window opened:
; original = as the game does it: below or above depending on where the cursor is, moved with the center of the city
; centered = in the middle of the city area
; cursor   = beside the cursor (right of it, or left near the sidebar), never past the edges of the city area
info_window = cursor

[compat]
; For troubleshooting only. Which processors the game uses. The GOG release keeps the whole game on one processor core
; (a Windows compatibility setting it installs).
; auto     = the game's own threads (and its sound) stay on that one core, as the compatibility setting wants; Yongle's
;            own work (putting the picture on the screen, saving screenshots) and the graphics driver's run on the
;            other cores (default)
; original = everything stays where Windows put it, as without this setting. If the game crashes or the sound goes
;            wrong, try this to see whether this setting is the cause, and please report it with the log.
; Takes effect after a restart.
cpu_affinity = auto

[timing]
; on  = timeBeginPeriod(1) while the game runs: the game's timers then tick in 1 ms steps on every machine,
;       instead of 15.6 ms unless some other program has raised the resolution (docs/performance.md 3.1)
; off = leave the system timer resolution alone
high_resolution_timer = on

[sound]
; When the game loses the focus (Alt+Tab, clicking another window, minimized):
; pause    = the music and the sounds wait and go on where they were when you come back (default)
; original = the game stops them all, and another song starts when you come back (as without Yongle)
background_sound = pause
; How often the city plays a random ambient sound (birds, water, workshops):
; 0.25, 0.5, 0.75, 1.0 = about so many per second whatever the resolution (a little less when the same sound is
;            still playing); 0.5 (default) is about what the game gave on the computers of its time
; original = once in about 300 main-loop passes, as the game does it: it depends on the resolution and the
;            computer (about one per second at 1024x768 on a fast computer, far fewer at a large resolution)
ambient_sounds = 0.5

[gameplay]
; on = ticks owed because a frame took long (large city, high resolution) are made up in the next frame (as
;      Augustus does), so the game runs at its set speed at any resolution; off = the game's own pace
keep_speed = on
; What game speed 100% means (other speeds are not affected):
; capped   = always the same pace, a step above 90% (90%: 45 steps a second, 100%: 62; as in Augustus) (default)
; original = the game's own 100%: as fast as the computer can draw, so it changes with the city and the resolution
;            (in a small city many times faster than 90%, in a large city on a big screen only a little faster)
full_speed = capped
; on  = the city goes on while the view scrolls (as in Augustus; default)
; off = it stands still while scrolling (the original)
simulate_while_scrolling = on

; on  = smooth pixel scrolling of the city: the same average speed as the game's own scrolling (the scroll speed
;       setting keeps its meaning), with Augustus's acceleration and deceleration
; off = the game's original scrolling in whole-tile steps
; Either way the simulation pauses while the view scrolls, as in the original.
smooth_scroll = on

[debug]
; on = every 10 s in the city the log counts the main-loop passes and the ambient sounds asked for and played
;      (for checking ambient_sounds; tools/verify/sound_probe_stats.py sums them)
sound_probe = off
; Saves two PNGs in shots\ in Yongle's folder (see the top of this file), both without our panel: the game's own picture at the resolution it
; draws (screen_0x00_game_1024x768_<time>.png) and what the screen shows (screen_0x00_screen-d3d11_2560x1440_<time>.png, with the renderer).
; The file names have the game's screen number, the resolution and the time; the log has one line per file.
; Same syntax as panel_key. The game itself does not use F11 (its own Alt+1..5 screenshots are unchanged).
screenshot_key = F11

; Problem report (R2b.1): when something odd is on the screen (e.g. flashing black blocks), press it right away. The
; log gets a mark (==== REPORT #n ====) and the game's statistics up to that moment; shots\ gets the picture shown
; and the screen (report<n>_screen_0x01_game_..., ..._screen_...) and our city buffer (..._m4city_...). Same syntax
; as panel_key. The game itself does not use F12.
report_key = F12

; Performance overlay (R2b.1-3): on = FPS, a graph of the time per main-loop pass and where the time goes (the game's
; simulation and drawing, our copies, the output) in the top left corner while playing. Switches at once.
perf_overlay = off

; on = framed pictures in label colors, for checking their layout with tools/verify/frame_check.py
frame_labels = off

; 0..5000: each of the five start-up loading screens stays on screen at least this many milliseconds, to look at or
; screenshot them (on a fast computer they flash by). 0 = as fast as the game loads. Read at start-up.
loading_stage_ms = 0
